# CI + security baseline. Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      # pgserver (the tests' embedded PostgreSQL) ships wheels up to cp312.
      python-version: "3.12"
      # Three pytest sessions (mini cell, finance-accounts, finance-transactions), coverage appended.
      test-command: ./run-tests.sh -q
      # Ratchet: measured 95.29% on 2026-11-12 (threshold = measured - 2, rounded down).
      coverage-threshold: "93"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

[project]
name = "platform-cellkit"
version = "1.1.0"
description = "Cell toolkit: one cell.yaml drives a microservice's API, migrations, roles, publisher and MCP server"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    # Ed25519 event signatures (SPEC-002); also what pyjwt[crypto] uses.
    "cryptography>=43",
    # [standard] = uvloop + httptools: +82% RPS in polyglot-benchmark-lab, and avoids the h11 Nagle stall
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
# cellkit.relay / cellkit.refs (outbox → Kafka, reference copies). kafka-python-ng cannot authenticate to Kafka 4.x.
kafka = ["confluent-kafka>=2.6,<3"]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "pgserver>=0.1.4",
    "mcp>=2.3,<3",
    "confluent-kafka>=2.6,<3",
    "mypy>=2.4",
    "types-PyYAML>=6",
]

[project.urls]
Source = "https://github.com/bookchaowalit/platform-cellkit"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Plain `pytest` runs the kit suite; ./run-tests.sh also runs tests/finance once per finance fixture.
testpaths = ["tests/kit"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "UP", "C4", "SIM", "RUF", "PIE", "PT", "RET", "ISC",
    "PERF", "LOG", "G", "FURB",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*/test_*_contract.py" = ["F403"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# Both test folders have a conftest.py; mypy would see one module name twice.
exclude = ["tests/finance/conftest\\.py$"]
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cellkit.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
warn_return_any = true

# Gradual: the contract suite and its fixtures. pytest injects their arguments by name.
[[tool.mypy.overrides]]
module = ["cellkit.contract", "cellkit.testing"]
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.setuptools.package-data]
# PEP 561: services type-check their calls into the kit.
cellkit = ["py.typed"]
